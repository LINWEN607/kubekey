name: Sync Fork

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/kubesphere/kubekey.git
          git fetch upstream
          git checkout main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git merge upstream/main --no-ff
          git push origin main
